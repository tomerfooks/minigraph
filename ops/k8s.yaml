# minigraph.cite.co.il — the MiniGraph landing site (static Astro build on nginx).
# Built on the node by devops/build/build.sh from ops/Dockerfile; the image is
# node-local (registry-less ctr import), hence imagePullPolicy: IfNotPresent.
apiVersion: v1
kind: Namespace
metadata:
  name: minigraph
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minigraph-site
  namespace: minigraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minigraph-site
  template:
    metadata:
      labels:
        app: minigraph-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: tomerfooks/minigraph-site:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { cpu: 100m, memory: 128Mi }
        volumeMounts:
        - { name: cache, mountPath: /var/cache/nginx }
        - { name: run, mountPath: /var/run }
        - { name: tmp, mountPath: /tmp }
      volumes:
      - { name: cache, emptyDir: {} }
      - { name: run, emptyDir: {} }
      - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: minigraph-site
  namespace: minigraph
spec:
  selector:
    app: minigraph-site
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minigraph-site
  namespace: minigraph
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # TLS terminates at Cloudflare
spec:
  ingressClassName: nginx
  rules:
  - host: minigraph.cite.co.il
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minigraph-site
            port:
              number: 80
