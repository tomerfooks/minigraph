name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Build examples
        run: go build ./...

      - name: README line-count claim is honest
        run: |
          n=$(cat graph.go checkpoint.go interrupt.go parallel.go | wc -l | tr -d ' ')
          grep -q "$n lines" README.md && grep -q "$n loc" README.md \
            || { echo "README line-count claim stale (actual: $n)"; exit 1; }
